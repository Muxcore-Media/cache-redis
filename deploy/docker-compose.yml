services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  cache-redis:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9600"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: cache-redis
      REDIS_ADDR: redis:6379
    depends_on:
      redis:
        condition: service_healthy
